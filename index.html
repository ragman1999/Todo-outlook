<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To do • Outlook</title>
  <style>
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 16px;
      background:#fff;
      color:#111;
    }
    h1{ font-size: 18px; margin:0 0 10px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
    textarea{
      width:100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 12px;
      border:1px solid #ddd;
      font-size: 16px;
      box-sizing:border-box;
      resize: vertical;
    }
    button{
      appearance:none;
      border:none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor:pointer;
      background:#111;
      color:#fff;
    }
    button.secondary{ background:#f2f2f2; color:#111; border:1px solid #e6e6e6; }
    .hint{
      font-size: 13px;
      color:#444;
      line-height: 1.4;
      margin-top: 8px;
    }
    .small{
      font-size: 12px; color:#666;
      margin-top: 12px;
    }
    code{
      background:#f5f5f5;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .out{
      white-space: pre-wrap;
      border:1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      min-height: 110px;
      box-sizing:border-box;
      background:#fafafa;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>To do • Outlook</h1>

  <div class="hint">
    Enter tasks separated by <b>new task</b>, line breaks, commas <code>,</code>, or semicolons <code>;</code>.
    Then tap <b>Add to Outlook</b>.
  </div>

  <div class="row">
    <button id="speakBtn" class="secondary">🎤 Speak to fill</button>
    <button id="copyBtn" class="secondary">📋 Copy formatted</button>
  </div>

  <textarea id="input" placeholder="e.g. Buy milk new task Email Sarah; Book dentist"></textarea>

  <div class="row">
    <button id="addBtn">➕ Add to Outlook</button>
  </div>

  <div class="hint">Formatted bullets (auto-updated):</div>
  <div id="formatted" class="out">• [ ] </div>

  <div class="small">
    If speech doesn't work, ensure Safari has microphone permission: Settings → Safari → Microphone.
  </div>

  <script>
    // =========================
    // CONFIG: set your Shortcut name exactly here
    // =========================
    const SHORTCUT_NAME = "ToDo";

    const $input = document.getElementById('input');
    const $formatted = document.getElementById('formatted');
    const $addBtn = document.getElementById('addBtn');
    const $copyBtn = document.getElementById('copyBtn');
    const $speakBtn = document.getElementById('speakBtn');

    function stripLeadingBullet(s){
      return s
        .replace(/^\s*•\s*\[ ?[ xX] ?\]\s*/g, '')
        .replace(/^\s*•\s*\[ ?[ ] ?\]\s*/g, '')
        .replace(/^\s*•\s*/g, '')
        .trim();
    }

    function normalizeSeparators(text){
      return text
        .replace(/\r\n/g, '\n')
        .replace(/\n+/g, '\n')
        .replace(/new task/gi, '###DELIM###')
        .replace(/[,;]/g, '###DELIM###')
        .replace(/\n/g, '###DELIM###');
    }

    function parseTasks(rawText){
      const norm = normalizeSeparators(rawText);
      const parts = norm.split('###DELIM###')
        .map(s => stripLeadingBullet(s))
        .map(s => s.trim())
        .filter(Boolean);

      // de-dupe for display
      const seen = new Set();
      const out = [];
      for (const p of parts){
        const key = p.toLowerCase();
        if (!seen.has(key)){
          seen.add(key);
          out.push(p);
        }
      }
      return out;
    }

    function formatTasks(tasks){
      if (!tasks.length) return "• [ ] ";
      return tasks.map(t => `• [ ] ${t}`).join('\n');
    }

    function updateFormatted(){
      const tasks = parseTasks($input.value || "");
      $formatted.textContent = formatTasks(tasks);
      return tasks;
    }

    function getFormattedForShortcut(){
      updateFormatted();
      return $formatted.textContent;
    }

    async function copyFormatted(){
      try{
        await navigator.clipboard.writeText($formatted.textContent);
        alert("Copied ✅");
      }catch(e){
        alert("Copy failed. Long-press the formatted area and copy manually.");
      }
    }

    function addToOutlook(){
      const payload = getFormattedForShortcut();

      // Trigger Shortcut via URL scheme
      const url =
        `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=${encodeURIComponent(payload)}`;

      window.location.href = url;
    }

    function startSpeech(){
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition){
        alert("Speech recognition not supported in this browser.");
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = "en-GB";
      rec.interimResults = true;
      rec.continuous = false;

      let finalText = "";

      rec.onstart = () => {
        $speakBtn.textContent = "🛑 Listening...";
        $speakBtn.disabled = true;
      };

      rec.onerror = () => {
        $speakBtn.textContent = "🎤 Speak to fill";
        $speakBtn.disabled = false;
        alert("Speech failed. Try again and ensure mic permission is enabled.");
      };

      rec.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++){
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript + " ";
          else interim += transcript;
        }
        const combined = (finalText + interim).trim();
        if (combined) $input.value = combined;
        updateFormatted();
      };

      rec.onend = () => {
        $speakBtn.textContent = "🎤 Speak to fill";
        $speakBtn.disabled = false;
        updateFormatted();
      };

      rec.start();
    }

    $input.addEventListener('input', updateFormatted);
    $copyBtn.addEventListener('click', copyFormatted);
    $addBtn.addEventListener('click', addToOutlook);
    $speakBtn.addEventListener('click', startSpeech);

    updateFormatted();
  </script>
</body>
</html>
